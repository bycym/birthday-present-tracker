name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        # Deliberately built without VITE_GOOGLE_CLIENT_ID. The value lives in
        # the `prod` environment, and claiming that environment here would make
        # every pull request wait on its protection rules. Nothing in lint,
        # type-check or test needs a real client ID — the missing value is only
        # detected at runtime — and deploy.yml fails loudly if it is absent.
        run: npm run build

      - name: Test
        run: npm run test
