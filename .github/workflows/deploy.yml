name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    # The client ID lives in the `prod` environment, and environment variables
    # only resolve in a job that declares that environment. The build is where
    # the value gets baked into the bundle, so it has to be declared here.
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # An OAuth client ID is a public identifier, so it belongs in an
          # environment variable — but accept a secret too, since either is a
          # reasonable place to have put it.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Fail if the client ID is missing or still a placeholder
        run: |
          if grep -rqF "your-client-id.apps.googleusercontent.com" dist/assets; then
            echo "::error::VITE_GOOGLE_CLIENT_ID is the .env.example placeholder; Google will reject sign-in."
            exit 1
          fi
          if ! grep -rqE "[A-Za-z0-9_-]+\.apps\.googleusercontent\.com" dist/assets; then
            echo "::error::VITE_GOOGLE_CLIENT_ID is not set in the 'prod' environment (as a variable or a secret); the deployed app cannot sign in."
            exit 1
          fi
          echo "Client ID present in bundle."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
